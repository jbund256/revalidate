[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "revalidate"
dynamic = ["version"]
authors = [
  { name="Jonas Bundschuh" },
]
description = "A package to manage interdependent fields"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)"
]
license = "GPL-3.0-only"
license-files = ["LICEN[CS]E*"]
keywords = ["valid", "invalid", "cache", "variable"]
dependencies = []

[project.urls]
Homepage = "https://github.com/jbund256/revalidate"
Repository = "https://github.com/jbund256/revalidate.git"
Issues = "https://github.com/jbund256/revalidate/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "numpy", "tox>=4.0", "ruff>=0.15"]

[tool.hatch.build.targets.wheel]
packages = ["src/revalidate"]

[tool.hatch.version]
path = "src/revalidate/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-rA"
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s %(levelname)s [%(name)s] %(message)s"
log_cli_date_format = "%H:%M:%S"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "PL"]
ignore = ["PLR2004"]

[tool.tox]
requires = ["tox>=4.0"]
env_list = ["3.11", "3.12", "3.13", "3.14", "lint"]

[tool.tox.env_run_base]
description = "Run pytest"
extras = ["dev"]
commands = [["pytest", "-q"]]

[tool.tox.env.lint]
description = "Run ruff"
base_python = "3.11"
extras = ["dev"]
commands = [["ruff", "check", "."]]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://upload.pypi.org/legacy/"
explicit = true
